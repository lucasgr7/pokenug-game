version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_POSTHOG_PROJECT_TOKEN
        - PUBLIC_POSTHOG_HOST
    ports:
      - "${WEB_PORT:-3030}:80"
    restart: unless-stopped
    networks:
      default: {}
      edge:
        aliases:
          - pokengu-web
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  edge:
    name: ${EXTERNAL_NETWORK_NAME:-gitea_dev-network}
    external: true
