version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokengu-web
    ports:
      - "${WEB_PORT:-3030}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
