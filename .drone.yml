kind: pipeline
type: docker
name: default

steps:
  - name: validate
    image: node:20-alpine
    environment:
      PUBLIC_POSTHOG_PROJECT_TOKEN:
        from_secret: PUBLIC_POSTHOG_PROJECT_TOKEN
      PUBLIC_POSTHOG_HOST:
        from_secret: PUBLIC_POSTHOG_HOST
    commands:
      - npm install
      - npm run check
      - npm run build

  - name: deploy
    image: docker:27-cli
    environment:
      PUBLIC_POSTHOG_PROJECT_TOKEN:
        from_secret: PUBLIC_POSTHOG_PROJECT_TOKEN
      PUBLIC_POSTHOG_HOST:
        from_secret: PUBLIC_POSTHOG_HOST
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - docker compose up --build -d
    when:
      branch:
        - main
      event:
        - push

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock

trigger:
  event:
    - push
    - pull_request