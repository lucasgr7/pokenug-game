kind: pipeline
type: docker
name: default

steps:
  - name: validate
    image: node:20-alpine
    environment:
      PUBLIC_POSTHOG_PROJECT_TOKEN:
        from_secret: PUBLIC_POSTHOG_PROJECT_TOKEN
      PUBLIC_POSTHOG_HOST:
        from_secret: PUBLIC_POSTHOG_HOST
    commands:
      - npm install
      - npm run check
      - npm run build

  - name: deploy
    image: docker:27-cli
    environment:
      PUBLIC_POSTHOG_PROJECT_TOKEN:
        from_secret: PUBLIC_POSTHOG_PROJECT_TOKEN
      PUBLIC_POSTHOG_HOST:
        from_secret: PUBLIC_POSTHOG_HOST
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    commands:
      - docker compose up --build -d
    when:
      branch:
        - main
      event:
        - push

  - name: push-to-github
    image: alpine/git
    failure: ignore
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        if [ -z "$GITHUB_TOKEN" ]; then
          echo ":: GITHUB_TOKEN secret not found — skipping GitHub push ::"
          exit 0
        fi
        git config user.name "Lucas Ribeiro"
        git config user.email "lucasgr7@gmail.com"
        git remote add github "https://lucasgr7:${GITHUB_TOKEN}@github.com/lucasgr7/pokenug-game.git"
        git fetch github main
        git push github "HEAD:main"
    when:
      branch:
        - main
      event:
        - push

volumes:
  - name: docker-socket
    host:
      path: /var/run/docker.sock

trigger:
  event:
    - push
    - pull_request