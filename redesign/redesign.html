<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pokémon — Batalha (Redesign)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Russo+One&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* surfaces */
    --bg-0:#0b0b10;
    --bg-1:#121219;
    --bg-2:#181821;
    --bg-3:#20212c;
    --line:#2b2c38;
    --txt:#f3f3f7;
    --txt-dim:#9a9bab;
    --txt-mute:#6b6c7e;
    /* multi-accent palette */
    --acc:#3ad6c2;        /* brand: teal */
    --acc-2:#6fe6d4;
    --mana:#a86bff;       /* energy / cost gem */
    --mana-2:#c9a3ff;
    --cta:#ffc24a;        /* end turn / primary action */
    --cta-2:#ffd87a;
    --enemy:#ff7a5f;      /* enemy ambient / hits */
    --good:#46c45f;
    --good-2:#7ee08f;
    --warn:#ff6b6b;
    --energy:#a86bff;
    /* phone */
    --phone-w:402px;
    --phone-h:874px;
    --radius:26px;
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#000;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--txt);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 80% at 50% -10%, #1a1218 0%, #0a0a0e 55%, #050507 100%);
  }
  #phone-scale{transform-origin:center center;}
  .phone{
    width:var(--phone-w);height:var(--phone-h);
    background:var(--bg-0);
    border-radius:var(--radius);
    position:relative;overflow:hidden;
    box-shadow:0 40px 120px -20px rgba(0,0,0,.9), 0 0 0 10px #101015, 0 0 0 12px #2a2b33, 0 0 0 13px #050506;
    display:flex;flex-direction:column;
  }

  /* ---------- status bar ---------- */
  .statusbar{height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px 0 22px;font-size:13px;font-weight:700;letter-spacing:.2px;color:#fff;z-index:40;}
  .statusbar .sb-r{display:flex;align-items:center;gap:7px;}
  .sb-icn{width:15px;height:13px;opacity:.95;}
  .battery{display:flex;align-items:center;gap:4px;}
  .battery .cell{width:24px;height:13px;border:1.6px solid rgba(255,255,255,.85);border-radius:3px;position:relative;display:flex;align-items:center;padding:1.6px;}
  .battery .cell::after{content:"";position:absolute;right:-3px;top:3.4px;width:2px;height:5px;background:rgba(255,255,255,.85);border-radius:0 1px 1px 0;}
  .battery .fill{height:100%;width:80%;background:#fff;border-radius:1px;}
  .battery .pct{font-size:11px;font-weight:700;}

  /* ---------- battle arena ---------- */
  .arena{flex:1;position:relative;overflow:hidden;
    background:
      radial-gradient(95% 55% at 70% 12%, rgba(255,110,90,.22), transparent 60%),
      radial-gradient(80% 50% at 22% 78%, rgba(58,214,194,.14), transparent 62%),
      radial-gradient(120% 60% at 50% 50%, rgba(168,107,255,.06), transparent 70%),
      linear-gradient(180deg,#161018 0%, #0d0d12 42%, #0a0e10 100%);
  }
  /* arena floor lines */
  .floor{position:absolute;left:50%;width:150%;height:240px;transform:translateX(-50%);
    border-radius:50%;pointer-events:none;}
  .floor.enemy{top:88px;background:radial-gradient(50% 60% at 50% 50%, rgba(255,140,120,.10), transparent 70%);}
  .floor.player{bottom:128px;background:radial-gradient(50% 60% at 50% 50%, rgba(80,210,190,.10), transparent 70%);}

  .sprite-wrap{position:absolute;display:flex;flex-direction:column;align-items:center;}
  .sprite-wrap .platform{position:absolute;bottom:-14px;width:130px;height:34px;border-radius:50%;
    background:radial-gradient(50% 60% at 50% 40%, rgba(0,0,0,.55), transparent 72%);filter:blur(1px);}
  .sprite-wrap .disc{position:absolute;bottom:-8px;width:124px;height:40px;border-radius:50%;
    background:radial-gradient(50% 60% at 50% 50%, rgba(150,140,205,.20), transparent 72%);}
  image-slot::part(empty){color:rgba(226,228,240,.82);}
  image-slot::part(frame){background:rgba(255,255,255,.03);}
  .enemy-sprite{top:96px;right:30px;}
  .player-sprite{bottom:310px;left:18px;}
  image-slot{display:block;}

  /* combatant nameplate */
  .plate{
    position:absolute;z-index:12;width:230px;
    background:linear-gradient(180deg, rgba(28,28,38,.94), rgba(18,18,24,.94));
    border:1px solid var(--line);
    border-radius:14px;padding:10px 12px 11px;
    box-shadow:0 10px 30px -12px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(6px);
  }
  .plate.enemy{top:62px;left:16px;}
  .plate.player{bottom:308px;right:16px;}
  .plate .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .plate .nm{font-size:16px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px;}
  .plate .lvl{font-size:10px;font-weight:700;color:var(--txt-mute);background:var(--bg-3);
    border:1px solid var(--line);border-radius:6px;padding:2px 6px;}
  .star-main{color:#ffcf3a;display:flex;}

  .hpbar{position:relative;height:18px;border-radius:9px;background:#0c0c11;border:1px solid #000;
    overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.7);}
  .hpbar .fill{position:absolute;inset:0;border-radius:9px;
    background:linear-gradient(180deg,var(--good-2),var(--good) 60%,#2f9a44);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.25);
    transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .hpbar .fill.low{background:linear-gradient(180deg,#ffb36b,#ff7a3d 60%,#d2541f);}
  .hpbar .fill.crit{background:linear-gradient(180deg,#ff8f8f,#ff4d4d 60%,#c62f2f);}
  .hpbar .glo{position:absolute;top:0;left:0;height:50%;width:100%;border-radius:9px 9px 0 0;
    background:linear-gradient(180deg,rgba(255,255,255,.28),transparent);pointer-events:none;}
  .hpbar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#06270d;text-shadow:0 1px 0 rgba(255,255,255,.25);letter-spacing:.3px;}

  .intent{margin-top:8px;display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,80,80,.12);border:1px solid rgba(255,90,90,.4);
    color:#ff9a9a;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;}
  .intent .v{color:#fff;font-weight:800;}
  .intent.buff{background:rgba(122,160,255,.12);border-color:rgba(122,160,255,.4);color:#aac4ff;}

  /* energy diamonds */
  .energy-row{margin-top:9px;display:flex;align-items:center;gap:6px;}
  .energy-row .lbl{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--txt-mute);}
  .pip{width:15px;height:15px;transform:rotate(45deg);border-radius:3px;
    background:linear-gradient(135deg,#2a2640,#1a1828);border:1px solid #3a3550;transition:.25s;}
  .pip.on{background:linear-gradient(135deg,#c9a3ff,#8b5cf6 60%,#6d3fd6);
    border-color:#b794ff;box-shadow:0 0 8px rgba(140,90,255,.7), inset 0 1px 0 rgba(255,255,255,.4);}
  .pip.spent{animation:pipPop .35s ease;}
  @keyframes pipPop{0%{transform:rotate(45deg) scale(1.4);filter:brightness(1.7);}100%{transform:rotate(45deg) scale(1);}}

  /* ---------- battle log ---------- */
  .log{position:absolute;left:0;right:0;bottom:270px;text-align:center;z-index:8;pointer-events:none;}
  .log .line{display:inline-block;font-size:12px;font-weight:600;color:var(--txt-dim);
    background:rgba(10,10,14,.55);border:1px solid rgba(255,255,255,.05);border-radius:999px;
    padding:5px 14px;backdrop-filter:blur(4px);animation:logIn .4s ease;}
  @keyframes logIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* floating damage numbers */
  .dmg-float{position:absolute;z-index:30;font-family:'Russo One';font-size:34px;font-weight:900;
    pointer-events:none;animation:dmgFloat 1s ease forwards;text-shadow:0 2px 8px rgba(0,0,0,.8);}
  @keyframes dmgFloat{0%{opacity:0;transform:translateY(0) scale(.6);}
    20%{opacity:1;transform:translateY(-10px) scale(1.15);}
    100%{opacity:0;transform:translateY(-58px) scale(.95);}}

  /* ---------- action bar ---------- */
  .actionbar{position:absolute;left:0;right:0;bottom:228px;z-index:25;
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;}
  .meta-chips{display:flex;align-items:center;gap:6px;}
  .chip{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--txt-dim);
    background:rgba(24,24,32,.85);border:1px solid var(--line);border-radius:9px;padding:5px 8px;
    backdrop-filter:blur(4px);}
  .chip svg{opacity:.8;}
  .auto-toggle{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.5px;
    color:var(--txt-dim);cursor:pointer;user-select:none;}
  .switch{width:38px;height:21px;border-radius:999px;background:#2a2b36;border:1px solid var(--line);
    position:relative;transition:.25s;}
  .switch .knob{position:absolute;top:1.5px;left:1.5px;width:16px;height:16px;border-radius:50%;
    background:#cfd0db;transition:.25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .auto-toggle.on .switch{background:linear-gradient(90deg,#1ea193,#3ad6c2);border-color:#6fe6d4;}
  .auto-toggle.on .switch .knob{left:19px;background:#fff;}
  .auto-toggle.on{color:#7ee9d8;}
  .endturn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;letter-spacing:.2px;color:#3b2400;
    background:linear-gradient(180deg,#ffd87a,#f0a91a);border:1px solid #ffe39a;border-radius:12px;
    padding:9px 14px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(240,165,0,.55), inset 0 1px 0 rgba(255,255,255,.55);
    transition:.15s;text-shadow:0 1px 0 rgba(255,240,200,.5);white-space:nowrap;}
  .endturn:active{transform:translateY(1px) scale(.98);}
  .endturn.dim{filter:grayscale(.4) brightness(.8);}

  /* ---------- hand / cards ---------- */
  .hand{position:absolute;left:0;right:0;bottom:22px;height:230px;z-index:20;}
  .card{position:absolute;left:50%;bottom:0;width:124px;height:184px;
    transform-origin:bottom center;cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.9,.25,1.1), filter .2s;
    will-change:transform;}
  .card.unaffordable{filter:grayscale(.55) brightness(.62);}
  .card.playing{transition:transform .45s cubic-bezier(.4,0,.2,1), opacity .45s;
    transform:translate(-50%,-260px) scale(.7) rotate(0deg)!important;opacity:0;}
  .card.shake{animation:cardShake .4s ease;}
  @keyframes cardShake{0%,100%{margin-left:0;}20%{margin-left:-7px;}40%{margin-left:7px;}60%{margin-left:-5px;}80%{margin-left:5px;}}

  /* metallic frame */
  .frame{width:100%;height:100%;border-radius:13px;padding:4px;position:relative;
    box-shadow:0 10px 22px -8px rgba(0,0,0,.85);}
  .frame::before{content:"";position:absolute;inset:0;border-radius:13px;padding:1px;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .inner{width:100%;height:100%;border-radius:10px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#1d1e26 0%,#141419 100%);
    display:flex;flex-direction:column;}

  /* RARITY = neutral metals (never an element color) */
  .rar-starter .frame{background:linear-gradient(150deg,#42434d,#26272e 55%,#1b1c22);}
  .rar-common  .frame{background:linear-gradient(150deg,#5a5d68,#34363f 50%,#23242b);}
  .rar-rare    .frame{background:linear-gradient(150deg,#eef3fa,#9fadbf 42%,#d4dde9 58%,#76808f);}
  .rar-epic    .frame{background:linear-gradient(150deg,#ffe9ab,#cba24c 42%,#f4d488 58%,#9a7830);}
  .rar-legendary .frame{background:conic-gradient(from 0deg,#ff7ad9,#8e9bff,#6ff0d0,#ffd36e,#ff9ad1,#ff7ad9);
    animation:irid 6s linear infinite;}
  @keyframes irid{to{filter:hue-rotate(360deg);}}

  /* rarity glow (pulses, scales with tier) */
  .rar-rare .frame{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 13px rgba(178,205,235,.0);animation:glowR 3s ease-in-out infinite;}
  .rar-epic .frame{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 15px rgba(255,200,90,.0);animation:glowE 2.6s ease-in-out infinite;}
  .rar-legendary .frame{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 20px rgba(180,120,255,.0);}
  @keyframes glowR{0%,100%{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 8px rgba(178,205,235,.25);}50%{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 16px rgba(190,215,245,.6);}}
  @keyframes glowE{0%,100%{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 10px rgba(255,200,90,.3);}50%{box-shadow:0 10px 22px -8px rgba(0,0,0,.85),0 0 20px rgba(255,210,110,.7);}}

  /* card header */
  .c-head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 7px 0;position:relative;z-index:3;}
  .cost{width:32px;height:35px;position:relative;display:flex;align-items:center;justify-content:center;
    clip-path:polygon(50% 0,100% 27%,100% 73%,50% 100%,0 73%,0 27%);
    background:linear-gradient(160deg,#f3e7ff 0%,#c9a3ff 32%,#8b5cf6 65%,#5926c4 100%);
    filter:drop-shadow(0 2px 4px rgba(40,10,90,.55)) drop-shadow(0 0 6px rgba(168,107,255,.35));}
  .cost::after{content:"";position:absolute;inset:2px;clip-path:inherit;
    background:linear-gradient(160deg,#dcc1ff 0%,#9a6cf0 55%,#5c2eb8 100%);}
  .cost::before{content:"";position:absolute;inset:0;clip-path:inherit;z-index:2;pointer-events:none;
    background:radial-gradient(45% 35% at 30% 22%, rgba(255,255,255,.75), transparent 65%);}
  .cost span{position:relative;z-index:3;font-family:'Russo One';font-size:17px;color:#fff;
    text-shadow:0 1px 0 rgba(60,20,140,.8),0 0 4px rgba(0,0,0,.4);}
  .rarity{display:flex;gap:2px;padding-top:3px;}
  .rarity .s{filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));}

  /* name banner */
  .c-name{margin:6px 6px 0;text-align:center;position:relative;z-index:3;}
  .c-name .t{font-size:11.5px;font-weight:800;letter-spacing:.2px;color:#fff;line-height:1.1;
    text-shadow:0 1px 2px rgba(0,0,0,.7);text-wrap:balance;}

  /* art window */
  .c-art{flex:1;margin:5px 7px 0;border-radius:8px;position:relative;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 38%,#23242e,#101015 80%);
    border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;}
  .c-art .halo{position:absolute;width:104px;height:104px;border-radius:50%;top:44%;left:50%;
    transform:translate(-50%,-50%);filter:blur(2px);opacity:.85;}
  .c-art .ring{position:absolute;width:68px;height:68px;border-radius:50%;top:44%;left:50%;
    transform:translate(-50%,-50%);border:1.5px solid currentColor;opacity:.55;}
  .c-art .glyph{position:relative;z-index:2;width:52px;height:52px;}
  .c-art .glyph svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
  /* damage / value badge */
  .stat{position:absolute;right:5px;bottom:5px;z-index:4;display:flex;align-items:center;gap:3px;
    background:rgba(8,8,12,.85);border:1px solid rgba(255,255,255,.12);border-radius:7px;padding:2px 6px;}
  .stat .v{font-family:'Russo One';font-size:15px;line-height:1;}
  .stat.atk .v{color:#ff8c5a;} .stat.def .v{color:#6fe6d4;} .stat.util .v{color:#c9a3ff;}
  .stat svg{width:12px;height:12px;}

  /* type chip */
  .c-foot{padding:5px 7px 7px;position:relative;z-index:3;}
  .typechip{display:flex;align-items:center;justify-content:center;gap:5px;border-radius:7px;
    padding:4px 6px;font-size:9.5px;font-weight:800;letter-spacing:.7px;
    border:1px solid;}
  .typechip svg{width:12px;height:12px;}

  /* selected / hover lift */
  .card.lift{z-index:60!important;}

  /* ---------- bottom nav ---------- */
  .navbar{height:78px;flex:0 0 78px;display:flex;align-items:center;justify-content:space-around;
    padding:6px 6px 14px;background:linear-gradient(180deg,#101016,#0a0a0e);
    border-top:1px solid var(--line);position:relative;z-index:30;}
  .nav-i{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;
    color:var(--txt-mute);min-width:52px;cursor:pointer;transition:.15s;}
  .nav-i svg{width:23px;height:23px;}
  .nav-i.active{color:var(--acc-2);}
  .gesture{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:128px;height:4.5px;
    border-radius:3px;background:#4a4b58;}

  /* turn banner flash */
  .turn-flash{position:absolute;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
    pointer-events:none;}
  .turn-flash .b{font-family:'Russo One';font-size:30px;letter-spacing:1px;color:#fff;
    text-shadow:0 4px 16px rgba(58,214,194,.7),0 0 24px rgba(168,107,255,.5);animation:turnB 1.1s ease forwards;opacity:0;}
  @keyframes turnB{0%{opacity:0;transform:scale(.8);}25%{opacity:1;transform:scale(1);}75%{opacity:1;}100%{opacity:0;transform:scale(1.05);}}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;
    font-size:12px;color:#7a7b8c;font-family:'JetBrains Mono',monospace;text-align:center;
    background:rgba(20,20,26,.7);border:1px solid #25262f;border-radius:8px;padding:6px 12px;white-space:nowrap;}

  /* ---------- inspect modal ---------- */
  .modal-backdrop{position:absolute;top:34px;left:0;right:0;bottom:0;
    background:rgba(5,5,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:100;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;
    animation:fadeIn .22s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-sheet{position:relative;width:100%;max-width:340px;
    background:linear-gradient(180deg,#1c1c25,#13131a);
    border:1px solid #2b2c38;border-radius:20px;
    padding:42px 16px 16px;
    box-shadow:0 -10px 36px rgba(0,0,0,.55),0 30px 80px rgba(0,0,0,.7);
    animation:sheetUp .34s cubic-bezier(.2,.9,.2,1.05);}
  @keyframes sheetUp{from{transform:translateY(28px) scale(.96);opacity:.3;}to{transform:translateY(0) scale(1);opacity:1;}}
  .m-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:none;
    background:rgba(255,255,255,.04);color:#a5a6b8;cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;z-index:5;}
  .m-close:hover{background:rgba(255,255,255,.1);color:#fff;}
  .m-card-wrap{display:flex;justify-content:center;margin-bottom:18px;}
  .m-play{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
    padding:14px;border-radius:13px;border:none;cursor:pointer;font-size:15px;font-weight:800;letter-spacing:.6px;color:#fff;
    background:linear-gradient(180deg,#c9a3ff,#8b5cf6 55%,#6d3fd6);
    box-shadow:0 8px 22px -6px rgba(140,90,255,.55),inset 0 1px 0 rgba(255,255,255,.3);
    transition:.15s;font-family:inherit;}
  .m-play:active{transform:translateY(1px) scale(.985);}
  .m-play:disabled{background:linear-gradient(180deg,#34353f,#22232a);color:#7a7b8c;
    box-shadow:none;cursor:not-allowed;}

  /* description region: lives inside Card, hidden in compact, shown in big */
  .c-desc{display:none;}

  /* big card variant for modal preview — same component, scaled up + desc visible */
  .card.big{cursor:default;}
  .card.big .frame{padding:5px;border-radius:18px;}
  .card.big .inner{border-radius:14px;}
  .card.big .c-head{padding:11px 12px 0;}
  .card.big .cost{width:44px;height:48px;}
  .card.big .cost span{font-size:24px;}
  .card.big .c-name{margin:10px 10px 0;}
  .card.big .c-name .t{font-size:17px;line-height:1.15;}
  .card.big .c-art{margin:10px 12px 0;border-radius:11px;flex:0 0 auto;height:160px;}
  .card.big .c-art .halo{width:150px;height:150px;}
  .card.big .c-art .ring{width:100px;height:100px;}
  .card.big .c-art .glyph{width:80px;height:80px;}
  .card.big .stat{padding:4px 10px;border-radius:9px;right:8px;bottom:8px;gap:5px;}
  .card.big .stat .v{font-size:22px;}
